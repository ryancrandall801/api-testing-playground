<!DOCTYPE html>
<html>
<head>
    <title>Create Test Case</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<div class="container">

<h1>Create Test Case</h1>

<a href="/ui/suites/{{ suite.id }}">← Back to Suite</a>

<form method="post" class="form-stack">

<label>Test Name</label>
<input name="name" required>

<label>HTTP Method</label>
<select name="method">
    <option>GET</option>
    <option>POST</option>
    <option>PUT</option>
    <option>PATCH</option>
    <option>DELETE</option>
</select>

<label>URL</label>
<input name="url" required>

<h2>Assertions</h2>

<label>Assertion Type</label>
<select name="assertion_type">
    <option value="status_code_equals">Status Code Equals</option>
    <option value="json_path_exists">JSON Path Exists</option>
    <option value="response_time_lt">Response Time Less Than</option>
</select>

<label>Expected Value</label>
<input name="assertion_expected">

<button type="submit">Create Test Case</button>

</form>

</div>

</body>
</html>
